name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_ENABLE_ANALYTICS: "false"
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role
      SYSTEM_RECRUITER_ID: 11111111-1111-4111-8111-111111111111
      RESEND_API_KEY: re_ci_placeholder
      UPSTASH_REDIS_REST_URL: https://example.com
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder-token
      STRIPE_SECRET_KEY: sk_test_placeholder

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:unit

      - name: Validate migrations
        run: npm run test:migrations

      - name: Build disposable test schema bundle
        run: npm run test:schema-bundle

      - name: Build production application
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end smoke tests
        run: npm run test:e2e

      - name: Audit production dependencies
        run: npm run security:audit

  rls-integration:
    name: Supabase RLS isolation
    if: ${{ vars.RUN_RLS_INTEGRATION == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_RLS_INTEGRATION: "1"
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      SUPABASE_TEST_SEEKER_EMAIL: seeker@hiregeneral.test
      SUPABASE_TEST_SEEKER_PASSWORD: ${{ secrets.SUPABASE_TEST_SEEKER_PASSWORD }}
      SUPABASE_TEST_RECRUITER_A_EMAIL: recruiter-a@hiregeneral.test
      SUPABASE_TEST_RECRUITER_A_PASSWORD: ${{ secrets.SUPABASE_TEST_RECRUITER_A_PASSWORD }}
      SUPABASE_TEST_RECRUITER_B_EMAIL: recruiter-b@hiregeneral.test
      SUPABASE_TEST_RECRUITER_B_PASSWORD: ${{ secrets.SUPABASE_TEST_RECRUITER_B_PASSWORD }}
      SUPABASE_TEST_ADMIN_EMAIL: admin@hiregeneral.test
      SUPABASE_TEST_ADMIN_PASSWORD: ${{ secrets.SUPABASE_TEST_ADMIN_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify RLS isolation
        run: npm run test:rls

  authenticated-e2e:
    name: Authenticated browser journeys
    if: ${{ vars.RUN_AUTHENTICATED_E2E == '1' }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      RUN_AUTHENTICATED_E2E: "1"
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      SUPABASE_TEST_SEEKER_EMAIL: seeker@hiregeneral.test
      SUPABASE_TEST_SEEKER_PASSWORD: ${{ secrets.SUPABASE_TEST_SEEKER_PASSWORD }}
      SUPABASE_TEST_RECRUITER_A_EMAIL: recruiter-a@hiregeneral.test
      SUPABASE_TEST_RECRUITER_A_PASSWORD: ${{ secrets.SUPABASE_TEST_RECRUITER_A_PASSWORD }}
      SUPABASE_TEST_RECRUITER_B_EMAIL: recruiter-b@hiregeneral.test
      SUPABASE_TEST_RECRUITER_B_PASSWORD: ${{ secrets.SUPABASE_TEST_RECRUITER_B_PASSWORD }}
      SUPABASE_TEST_ADMIN_EMAIL: admin@hiregeneral.test
      SUPABASE_TEST_ADMIN_PASSWORD: ${{ secrets.SUPABASE_TEST_ADMIN_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run authenticated end-to-end journeys
        run: npm run test:e2e:authenticated

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: authenticated-playwright-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
